# Physical Core C counter/NCO macro.
# This is a standard-cell digital phase accumulator; TICK is the external
# high-speed reference and OUT is the generated clock.
DESIGN_NAME: PLL_COUNTER_DCO_PHYS
VERILOG_FILES:
  - dir::../../../src/pll_counter_dco_phys.v
  - dir::../../../src/ssbbpd.v
  - dir::../../../src/pll_cells_ics55.v

PDK: ics55
STD_CELL_LIBRARY: ics55_LLSC_H7CR
CLOCK_PORT: TICK
CLOCK_PERIOD: 1.0

PNR_SDC_FILE: dir::constraints/top.sdc
SIGNOFF_SDC_FILE: dir::constraints/top.sdc

VDD_NETS: [VDD]
GND_NETS: [VSS]
RT_MIN_LAYER: MET1
RT_MAX_LAYER: MET5
IO_PIN_H_LAYER: MET3
IO_PIN_V_LAYER: MET2
FP_CORE_UTIL: 30
PL_TARGET_DENSITY_PCT: 45
DIE_AREA: [0, 0, 100, 100]

