# LibreLane physical macro for PLL_COUNTER_DCO_PHYS on sky130_fd_sc_hd.
DESIGN_NAME: PLL_COUNTER_DCO_PHYS

VERILOG_FILES:
  - dir::src/pll_counter_dco_phys.v
  - dir::src/ssbbpd.v
  - dir::src/pll_cells_sky130_fd_sc_hd.v

PDK: sky130_fd_sc_hd
STD_CELL_LIBRARY: sky130_fd_sc_hd

VDD_PIN: VPWR
GND_PIN: VGND
SCL_POWER_PINS: [VPWR, VPB]
SCL_GROUND_PINS: [VGND, VNB]
VDD_NETS: [VPWR]
GND_NETS: [VGND]

RT_MIN_LAYER: met1
RT_MAX_LAYER: met5
IO_PIN_H_LAYER: met3
IO_PIN_V_LAYER: met2

DIE_AREA: [0, 0, 180, 140]
FP_CORE_UTIL: 25
PL_TARGET_DENSITY_PCT: 45

CLOCK_PORT: TICK
CLOCK_PERIOD: 10.0

# OpenROAD 2026-02-17's CTS pass segfaults in separateMacroRegSinks on this
# two-clock macro.  The macro is small and the timing signoff is gate-level
# OpenSTA with ideal clocks, so skip CTS rather than fabricate a clock tree.
RUN_CTS: false
RUN_POST_CTS_RESIZER_TIMING: false

# This experiment has no RCX ruleset; the dedicated characterization uses
# gate-level OpenSTA and the macro SPICE view, so skip the flow's SPEF/IR-drop
# and post-PnR multi-corner STA steps.
RUN_SPEF_EXTRACTION: false
RUN_IRDROP_REPORT: false
RUN_MCSTA: false
# The counter LVS closure uses the hierarchy-preserving Magic GDS (the
# KLayout streamout loses the decap-cell hierarchy on this macro).  The
# flow's Magic-vs-KLayout XOR check is not used by the dedicated DRC/LVS
# driver.
RUN_KLAYOUT_XOR: false
PNR_SDC_FILE: dir::macro.sdc.tcl
SIGNOFF_SDC_FILE: dir::macro.sdc.tcl

LIB:
  "*_tt_025C_1v80":
    - /home/yanlu/.ciel/ciel/sky130/versions/8afc8346a57fe1ab7934ba5a6056ea8b43078e71/sky130A/libs.ref/sky130_fd_sc_hd/lib/sky130_fd_sc_hd__tt_025C_1v80.lib
STA_CORNERS:
  - nom_tt_025C_1v80
PNR_CORNERS:
  - nom_tt_025C_1v80
RCX_RULESETS: {}
