# LibreLane integration test: two dll8_line4 hard macros chained (DLL8 line8).
# Purpose: prove the LEF/GDS/liberty views are readable, placeable, routable.
# NOT a signoff run -- no timing closure (stub liberty, comb arcs only).

DESIGN_NAME: dll8_line8_test
VERILOG_FILES:
  - dir::../dll8_line8_test.v
  - dir::../dll8_line4.v

PDK: ihp-sg13g2
STD_CELL_LIBRARY: sg13g2_stdcell

VDD_PIN: VDD
GND_PIN: VSS
SCL_POWER_PINS: [VDD]
SCL_GROUND_PINS: [VSS]
VDD_NETS: [VDD]
GND_NETS: [VSS]

RT_MIN_LAYER: Metal2
RT_MAX_LAYER: Metal5

# PDN acceptance for the respin macro: power pins are M5 end pads at local
# x[67.61,69.26] y[9.18..12.36].  The M4 feed trunks end at x=67.5, leaving a
# ~1.7 um x-window inside the pads that is unobstructed all the way down:
# vertical stripes phased onto that window (abs x 78.35 / 229.55 for the two
# strips, exactly 2x the 75.6 um pitch apart) reach the pads and continue to
# the die boundary.  No standard cells exist in this test top, so the
# followpin rails (source of the PDN-0179 channel-repair failures) are off.
PDN_CFG: dir::pdn_cfg.tcl
PDN_ENABLE_RAILS: false
PDN_VOFFSET: 65.24

# Residual global-route congestion is 2 grid cells at 5.4% total usage --
# an artifact of the 30% global adjustment over the narrow channels, not
# real capacity.  Detailed routing (the actual acceptance criterion, as in
# smoke4) is the arbiter; allow GRT to hand over.
GRT_ALLOW_CONGESTION: true

# This acceptance top has NO standard cells (two hard macros + tie/constant
# logic only).  Tap/endcap insertion therefore inserts welltap cells whose
# M1 rails have nothing to connect to (rails are disabled because the earlier
# PDN-0179 channel-repair failure came from followpin rails) -> PSM-0069 on
# VDD in accept6.  No stdcells, no taps.
RUN_TAP_ENDCAP_INSERTION: false

# accept6 left 6 Metal5 spacing violations at the macro EN-pin staircase;
# give the detailed router more optimization iterations.
DRT_OPT_ITERS: 128

# no clock in this test top (IN is a data input); STA is meaningless for the
# stub liberty -- this run validates macro reading/placement/routing only.
CLOCK_PORT: null

# Die width: the two strips leave two vertical channels. PDN-0179 in the
# first acceptance run showed ~4-6 um channels are unrepairable for the
# stdcell grid; give the center channel ~30 um and the east channel ~20 um.
DIE_AREA: [0, 0, 240, 760]
FP_SIZING: absolute
FP_CORE_UTIL: 5
PL_TARGET_DENSITY_PCT: 30

# strip is 69.26 x 358.53 (power respin widened it).  EN pins escape on the RIGHT edge of each strip,
# so the two strips must not face each other's right edge: place both with
# orientation N, right edges toward the core center channel.
MACROS:
  dll8_line4:
    gds: dir::../dll8_line4.gds
    lef: dir::../dll8_line4.lef
    lib:
      nom_typ_1p20V_25C:
        - dir::../dll8_line4__tt.lib
      nom_slow_1p08V_125C:
        - dir::../dll8_line4__ss.lib
      nom_fast_1p32V_m40C:
        - dir::../dll8_line4__ff.lib
    instances:
      line_a:
        location: [10, 20]
        orientation: N
      line_b:
        location: [161.2, 20]
        orientation: N

LIB:
  nom_typ_1p20V_25C:
    - dir::../build/pdk_root/ihp-sg13g2/libs.ref/sg13g2_stdcell/lib/sg13g2_stdcell_typ_1p20V_25C.lib
  nom_slow_1p08V_125C:
    - dir::../build/pdk_root/ihp-sg13g2/libs.ref/sg13g2_stdcell/lib/sg13g2_stdcell_slow_1p08V_125C.lib
  nom_fast_1p32V_m40C:
    - dir::../build/pdk_root/ihp-sg13g2/libs.ref/sg13g2_stdcell/lib/sg13g2_stdcell_fast_1p32V_m40C.lib
STA_CORNERS:
  - nom_typ_1p20V_25C

PNR_SDC_FILE: dir::test.sdc.tcl
SIGNOFF_SDC_FILE: dir::test.sdc.tcl
