# LibreLane physical macro for TDC_TOP on sky130_fd_sc_hd.
# SAR time-to-digital converter on the shared COARSE/MID/FINE DCDL.
DESIGN_NAME: TDC_TOP

VERILOG_FILES:
  - dir::src/tdc_top.v
  - dir::src/pll_counter_dcdl_phys.v
  - dir::src/coarse_delay.v
  - dir::src/mid_delay.v
  - dir::src/fine_delay.v
  - dir::src/digital_loop_filter.v
  - dir::src/term_decoder.v
  - dir::src/pll_cells_sky130_fd_sc_hd.v

PDK: sky130_fd_sc_hd
STD_CELL_LIBRARY: sky130_fd_sc_hd

VDD_PIN: VPWR
GND_PIN: VGND
SCL_POWER_PINS: [VPWR, VPB]
SCL_GROUND_PINS: [VGND, VNB]
VDD_NETS: [VPWR]
GND_NETS: [VGND]

RT_MIN_LAYER: met1
RT_MAX_LAYER: met5
IO_PIN_H_LAYER: met3
IO_PIN_V_LAYER: met2

DIE_AREA: [0, 0, 180, 160]
