# LibreLane build of PLL_ANALOG_MACRO on gf180mcu_as_sc_mcu7t3v3.
# This is a first-pass digital P&R of the analog macro netlist, not the custom
# symmetric analog floorplan used by the ics55/IHP ckdur flow.  The wrapper
# and PLL_CELL mappings are functional; timing/analog placement is not final.
