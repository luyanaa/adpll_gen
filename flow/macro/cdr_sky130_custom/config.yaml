# LibreLane physical macro for CDR_TOP on sky130_fd_sc_hd.
# Alexander bang-bang CDR: DCDL phase-shifter + DLF + samplers.
DESIGN_NAME: CDR_TOP

VERILOG_FILES:
  - dir::src/cdr_top.v
  - dir::src/alexander_pd.v
  - dir::src/pll_counter_dcdl_phys.v
  - dir::src/coarse_delay.v
  - dir::src/mid_delay.v
  - dir::src/fine_delay.v
  - dir::src/digital_loop_filter.v
  - dir::src/term_decoder.v
  - dir::src/pll_cells_sky130_fd_sc_hd.v
  - dir::src/dual_sampler_sky130.v

PDK: sky130_fd_sc_hd
STD_CELL_LIBRARY: sky130_fd_sc_hd

VDD_PIN: VPWR
GND_PIN: VGND
SCL_POWER_PINS: [VPWR, VPB]
SCL_GROUND_PINS: [VGND, VNB]
VDD_NETS: [VPWR]
GND_NETS: [VGND]

RT_MIN_LAYER: met1
RT_MAX_LAYER: met5
IO_PIN_H_LAYER: met3
IO_PIN_V_LAYER: met2

DIE_AREA: [0, 0, 180, 160]
FP_CORE_UTIL: 20
PL_TARGET_DENSITY_PCT: 35

CLOCK_PORT: TICK
CLOCK_PERIOD: 10.0

RUN_CTS: false
RUN_POST_CTS_RESIZER_TIMING: false
# One marginal antenna violation (long DCDL mux-select net) — enable
# diode repair during global route + heuristic diode insertion.
RUN_ANTENNA_REPAIR: true
RUN_HEURISTIC_DIODE_INSERTION: true
RUN_SPEF_EXTRACTION: false
RUN_IRDROP_REPORT: false
RUN_MCSTA: false
RUN_KLAYOUT_XOR: false
PNR_SDC_FILE: dir::macro.sdc.tcl
SIGNOFF_SDC_FILE: dir::macro.sdc.tcl

LIB:
  "*_tt_025C_1v80":
    - /home/yanlu/.ciel/ciel/sky130/versions/8afc8346a57fe1ab7934ba5a6056ea8b43078e71/sky130A/libs.ref/sky130_fd_sc_hd/lib/sky130_fd_sc_hd__tt_025C_1v80.lib
STA_CORNERS:
