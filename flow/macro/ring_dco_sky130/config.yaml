# LibreLane physical macro for PLL_RING_DCO_PHYS on sky130_fd_sc_hd.
DESIGN_NAME: PLL_RING_DCO_PHYS

VERILOG_FILES:
  - dir::src/pll_ring_dco_phys.v
  - dir::src/il_dco.v
  - dir::src/coarse_delay.v
  - dir::src/mid_delay.v
  - dir::src/fine_delay.v
  - dir::src/sym.v
  - dir::src/sym_mux.v
  - dir::src/ssbbpd.v
  - dir::src/pll_cells_sky130_fd_sc_hd.v

PDK: sky130_fd_sc_hd
STD_CELL_LIBRARY: sky130_fd_sc_hd

VDD_PIN: VPWR
GND_PIN: VGND
SCL_POWER_PINS: [VPWR, VPB]
SCL_GROUND_PINS: [VGND, VNB]
VDD_NETS: [VPWR]
GND_NETS: [VGND]

RT_MIN_LAYER: met1
RT_MAX_LAYER: met5
IO_PIN_H_LAYER: met3
IO_PIN_V_LAYER: met2

DIE_AREA: [0, 0, 220, 180]
FP_CORE_UTIL: 25
PL_TARGET_DENSITY_PCT: 45

CLOCK_PORT: REF
CLOCK_PERIOD: 20.0

# The ring macro has no REF-clocked flops; REF only feeds the combinational
# SS-BBPD and the slope balancer.  OpenROAD's CTS pass segfaults on this
# sinkless clock, so skip CTS and route REF as an ordinary signal.
RUN_CTS: false
RUN_POST_CTS_RESIZER_TIMING: false

# This experiment has no RCX ruleset; the dedicated characterization uses the
# cell-level SPICE and gate-level OpenSTA, so skip SPEF/IR-drop steps.
RUN_SPEF_EXTRACTION: false
RUN_IRDROP_REPORT: false
RUN_MCSTA: false
# The Magic and KLayout streamout views differ by one fill polygon on
# 235/4; the canonical view is the KLayout GDS.  The dedicated KLayout DRC/LVS
# driver is used instead of the flow's XOR check.
RUN_KLAYOUT_XOR: false
PNR_SDC_FILE: dir::macro.sdc.tcl
SIGNOFF_SDC_FILE: dir::macro.sdc.tcl

LIB:
  "*_tt_025C_1v80":
    - /home/yanlu/.ciel/ciel/sky130/versions/8afc8346a57fe1ab7934ba5a6056ea8b43078e71/sky130A/libs.ref/sky130_fd_sc_hd/lib/sky130_fd_sc_hd__tt_025C_1v80.lib
STA_CORNERS:
  - nom_tt_025C_1v80
PNR_CORNERS:
  - nom_tt_025C_1v80
RCX_RULESETS: {}
