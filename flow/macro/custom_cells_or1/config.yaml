# Harness landing the three custom/analog cells (OR1 / OpenRule1um,
# or1_fd_sc, VDD=5.0V).  Synthesis-only landing — no timing requirement.
DESIGN_NAME: CUSTOM_CELLS_TOP
VERILOG_FILES:
  - dir::src/custom_cells_top.v
  - dir::src/dly_stage_or1.v
  - dir::src/arbiter_or1.v
  - dir::src/dual_sampler_or1.v
PDK: or1
STD_CELL_LIBRARY: or1_fd_sc
VDD_PIN: vdd
GND_PIN: gnd
SCL_POWER_PINS: [VDD]
SCL_GROUND_PINS: [VSS]
VDD_NETS: [VDD]
GND_NETS: [VSS]
RT_MIN_LAYER: metal1
RT_MAX_LAYER: metal3
IO_PIN_H_LAYER: metal3
IO_PIN_V_LAYER: metal2
# Absolute sizing so DIE_AREA is honoured (relative ignores it).
# OR1 cells are 30um tall (SITE unit 0.5x30), so a 60um die fits ~2 rows;
# give it room.
FP_SIZING: absolute
DIE_AREA: [0, 0, 400, 400]
FP_CORE_UTIL: 20
PL_TARGET_DENSITY_PCT: 40
CLOCK_PORT: [REF, CK]
CLOCK_PERIOD: 10.0
RUN_CTS: false
RUN_POST_CTS_RESIZER_TIMING: false
RUN_SPEF_EXTRACTION: false
RUN_IRDROP_REPORT: false
RUN_MCSTA: false
RUN_KLAYOUT_XOR: false
RUN_ANTENNA_REPAIR: true
PNR_SDC_FILE: dir::macro.sdc.tcl
SIGNOFF_SDC_FILE: dir::macro.sdc.tcl
LIB:
  "*_tt_5P0_25C":
    - /grid/OpenRule1um/OR1PDK/OR1/libs.ref/or1_fd_sc/lib/or1_fd_sc_TT_5P0_25C.lib
STA_CORNERS:
  - nom_tt_5P0_25C
PNR_CORNERS:
  - nom_tt_5P0_25C
RCX_RULESETS: {}
RUN_KLAYOUT_DRC: false
RUN_MAGIC_DRC: false
RUN_LVS: false
