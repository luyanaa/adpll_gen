# instance_name X_um Y_um Orientation  (FIRM via Odb.ManualMacroPlacement)
# OR1 DPL cannot legalise the wide DFF cells (DFFRX1 = 84 sites) once
# narrow cells crowd the shared rows: the diamond search finds no legal
# abutment and checkPixels rejects them.  Same root cause as the OR1
# counter test (129-site DFFPOSX1) -> pin each FF FIRM on a dedicated
# row so it gets an unbroken run of sites.  Rows are 30um tall on
# y = 120,150,180,210,240 (N/FS alternating); FS rows need MX/MY-free
# orientation the cell's SYMMETRY Y supports -> use FS for row 1/3.
# Keep the three FFs on separate rows, clear of each other and the IO.
u_arb.u_dec   50.0 150.0 FS
u_ds.u_pos   200.0 150.0 FS
u_ds.u_neg   200.0 210.0 FS
