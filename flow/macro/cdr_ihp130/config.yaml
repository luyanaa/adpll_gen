# LibreLane physical macro for CDR_TOP on IHP SG13G2 1.2 V.
#
# Analog back end for OpenSERDES CDR_MODE=4: a multi-phase DCO plus a
# glitch-managed phase mux and a sampler.  Contract:
#   ../OpenSERDES/rtl/serdes_rx_digital.sv  (rx_dll_tap -> rx_smp)
#   ../OpenSERDES/rtl/cdr_multiphase.sv     (2^PH_W phases)
#   ../OpenSERDES/docs/dll_backend.md §2, §5
#
# The bang-bang loop, the slot/fine accumulator and the lock FSM stay in
# cdr_multiphase (digital, generic); this macro is the DLL/sampler half.

DESIGN_NAME: CDR_TOP

VERILOG_FILES:
  - dir::src/cdr_top.v
  - dir::../../../src/pll_multiphase_dco.v
  - dir::src/pll_cells_ihp-sg13g2.v

PDK: ihp-sg13g2
STD_CELL_LIBRARY: sg13g2_stdcell

VDD_PIN: VDD
GND_PIN: VSS
SCL_POWER_PINS: [VDD]
SCL_GROUND_PINS: [VSS]
VDD_NETS: [VDD]
GND_NETS: [VSS]

# Metal3 is the signal layer the sg13g2 stdcell pins land on; route above it.
RT_MIN_LAYER: Metal2
RT_MAX_LAYER: Metal5

CLOCK_PORT: REF
CLOCK_PERIOD: 10.0

PNR_SDC_FILE: dir::macro.sdc.tcl
SIGNOFF_SDC_FILE: dir::macro.sdc.tcl

# The phase delay line is a ring: do not let CTS or the resizer touch it.
DESIGN_REPAIR_REMOVE_BUFFERS: false

DIE_AREA: [0, 0, 120, 100]
FP_CORE_UTIL: 25
PL_TARGET_DENSITY_PCT: 40

# Multi-corner standard-cell libraries.  One corner is enough for the P&R
# optimiser, but the signoff STA and the resizer need all three so the
# CDR_MODE=4 contract is checked at every voltage/temperature corner the
# macro can see.  Paths resolve against this directory's own build/pdk_root;
# point it at the shared root with a symlink (ln -s ../../build build).
LIB:
  nom_tt_025C_1v20:
    - dir::build/pdk_root/ihp-sg13g2/libs.ref/sg13g2_stdcell/lib/sg13g2_stdcell_typ_1p20V_25C.lib
  nom_ss_125C_1v08:
    - dir::build/pdk_root/ihp-sg13g2/libs.ref/sg13g2_stdcell/lib/sg13g2_stdcell_slow_1p08V_125C.lib
  nom_ff_n40C_1v32:
    - dir::build/pdk_root/ihp-sg13g2/libs.ref/sg13g2_stdcell/lib/sg13g2_stdcell_fast_1p32V_m40C.lib
STA_CORNERS:
  - nom_tt_025C_1v20
  - nom_ss_125C_1v08
  - nom_ff_n40C_1v32
RCX_RULESETS:
  "nom_tt_025C_1v20": dir::build/pdk_root/ihp-sg13g2/libs.ref/sg13g2_stdcell/rcx/IHP_rcx_patterns.rules
  "nom_ss_125C_1v08": dir::build/pdk_root/ihp-sg13g2/libs.ref/sg13g2_stdcell/rcx/IHP_rcx_patterns.rules
  "nom_ff_n40C_1v32": dir::build/pdk_root/ihp-sg13g2/libs.ref/sg13g2_stdcell/rcx/IHP_rcx_patterns.rules

# Signoff switches: same collateral as the canary top.  Magic.WriteLEF is
# kept off -- it only feeds the antenna checker and the PDK GDS tech cannot
# map the macro's unnamed 62/0 marker layer.
RUN_MAGIC_STREAMOUT: false
RUN_KLAYOUT_STREAMOUT: true
RUN_MAGIC_WRITE_LEF: false
RUN_KLAYOUT_XOR: false
RUN_MAGIC_DRC: true
RUN_KLAYOUT_DRC: true
RUN_LVS: true
RUN_EQY: false
KLAYOUT_DRC_RUNSET: dir::build/pdk_root/ihp-sg13g2/libs.tech/klayout/tech/drc/ihp-sg13g2.drc

# The vendored ihp-sg13g2-signoff.tech is unusable: its `lef` section maps
# routing/cut layers to names (m1..m7, via1..) it never defines as magic
# types, which makes cifinput error out and kills both `gds read` and
# `lef read`.  The main ihp-sg13g2.tech is the complete tech -- it includes
# cifin/cifout, the vendor drc deck, a correct lef section, and the ngspice
# device-extract rules -- so a thin local magicrc loads it for every Magic
# step (DRC, streamout and SPICE extraction all share it).
MAGICRC: dir::cdr_ihp130.magicrc
MAGIC_TECH: dir::build/pdk_root/ihp-sg13g2/libs.tech/magic/ihp-sg13g2.tech
MAGIC_LEF_WRITE_USE_GDS: true
# GDS path for extraction: the DEF/LEF route is dead anyway (signoff tech)
# and GDS gives ext2spice the real transistor-level netlist for LVS.
MAGIC_EXT_USE_GDS: true

# Netgen.LVS inside LibreLane does not reach the IHP setup.  This
# directory's build/ is the canary build, whose librelane config.tcl sets
# NETGEN_SETUP to /dev/null, so scripts/netgen/setup.tcl dies on `cells1`
# and every sg13_lv_* fet is compared as a pinless placeholder.  Do not read
# that run's 91 errors as a layout result.  The recomparison against
# ihp-sg13g2_setup.tcl is in SIGNOFF.md: the netlist matches, two cells do
# not.  A fresh LibreLane run only counts once NETGEN_SETUP points at
# build/pdk_root/ihp-sg13g2/libs.tech/netgen/ihp-sg13g2_setup.tcl.

# ---------------------------------------------------------------------------
# Deterministic DCO ring placement + IO pin spacing.
#
# The 513-stage ring must present a *uniform* 64-stage delay per tap interval.
# Left to the global placer the single long chain gets scattered around the
# die, so each tap interval picks up a different routed wire length and the
# per-tap phase residual exceeded the 30 ps budget.  MANUAL_GLOBAL_PLACEMENTS
# lays the chain out as a compact snake: every stage abuts the next, so each
# 64-stage interval spans the same ~100 um of wire.  Each tap buffer, its
# PHASE observability buffer and the mux leaf are inserted next to their tap.
#
# IO_PIN_MIN_DISTANCE widens the right-edge pin pitch; the default two-track
# pitch put REF within the Metal3 spacing rule of TAP[1] and RST_N.
# ---------------------------------------------------------------------------
IO_PIN_MIN_DISTANCE: 2.0
MANUAL_GLOBAL_PLACEMENTS:
