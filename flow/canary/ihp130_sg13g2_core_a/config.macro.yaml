# LibreLane v3.0.16 configuration -- FULL PLL top (`pll`) with `PLL_ANALOG`
# as a hard macro -- IHP SG13G2, 1.2 V, Core A (IL-DCO).
#
# STATUS: the hard-macro views are wired in.  The analog macro is built and
# macro-level DRC/LVS pass on the official IHP decks (see
# flow/macro/ihp130_sg13g2/README.md and flow/IHP130_TAPEOUT_GAPS.md).
#
# What this run can and cannot claim:
#   * CAN: elaboration, placement of the macro, digital P&R around it, RCX.
#   * CANNOT: closed timing.  The macro Liberty has no setup/hold arc from
#     SS_BBPD to the INJ_EDGE sampling edge (gap B2), so the digital loop
#     filter's capture of SS_BBPD is unchecked.  One TT macro Liberty only
#     (gap B4), so the SS/FF corners are not macro-valid.
#
# Run from this directory once the views exist:
#   make librelane-macro
# (or with the release's --pdk/--scl flags).

DESIGN_NAME: pll_macro_top

VERILOG_FILES:
  # pll_macro_top binds pll_logic to the P&R macro PLL_ANALOG_MACRO.
  # Do NOT use src/pll.v here: it instantiates the behavioural PLL_ANALOG.
  - dir::../../../src/pll_macro_top.v
  - dir::../../../src/pll_logic.v
  - dir::../../../src/digital_loop_filter.v
  - dir::../../../src/term_decoder.v
  - dir::../../../src/freq_lock.v
  - dir::../../../src/delta_sigma.v
  - dir::../../../src/fix_div.v
  - dir::../../../src/conf_div.v
  - dir::../../../src/frequency_counter_frontend.v
  - dir::../../../src/ref_watchdog.v
  - dir::../../../src/lock_detector.v
  - dir::../../../src/ddr_ck.v
  # Gate-level netlist of the routed macro (port-compatible with the
  # blackbox, so the flow can elaborate it and OpenROAD can honour the LEF).
  - dir::hardmacro/PLL_ANALOG_MACRO.v

# ---------------------------------------------------------------------------
# PDK / standard-cell library
# ---------------------------------------------------------------------------
PDK: ihp-sg13g2
STD_CELL_LIBRARY: sg13g2_stdcell

# The routed macro netlist has its parameters baked in.  POSTSYN drops the
# parameter override in pll_macro_top's instantiation; without it Yosys fails
# with 'Parameter not found: IL_NDELS'.
VERILOG_DEFINES:
  - POSTSYN

# ---------------------------------------------------------------------------
# Hard macro
# ---------------------------------------------------------------------------
# All views are copies of flow/macro/ihp130_sg13g2/PLL_ANALOG_MACRO.*:
#   hardmacro/PLL_ANALOG.gds         filled stream-out
#   hardmacro/PLL_ANALOG.lef         abstract, 71 pins, SIZE 160x105
#   hardmacro/PLL_ANALOG.lib         TT 1.20 V / 25 C only
#   hardmacro/PLL_ANALOG_MACRO.v     routed gate netlist
# The LEF and Liberty both name the cell PLL_ANALOG_MACRO, so the MACROS key
# must use that name (not PLL_ANALOG).
#
# Multi-corner note: only a TT macro Liberty exists, so only nom_tt_025C_1v20
# is macro-valid.  SS/FF results here are digital-only extrapolations.
MACROS:
  PLL_ANALOG_MACRO:
    gds: dir::hardmacro/PLL_ANALOG.gds
    lef: dir::hardmacro/PLL_ANALOG.lef
    # Real per-corner macro Liberty, extracted from the routed database with
    # flow/macro/ihp130_sg13g2/extract_multi_corner.tcl (RCX + write_timing_model
    # per scene).  Values differ: SS 1.08 V/125 C, TT 1.20 V/25 C,
    # FF 1.32 V/-40 C.  Regenerate with:
    #   PDK_ROOT=<ciel ihp root> TOP=PLL_ANALOG_MACRO \
    #   FINAL_DB=pnr/outputs/ihp-sg13g2-sg13g2_stdcell/PLL_ANALOG_MACRO.final.db \
    #   OUTDIR=flow/macro/ihp130_sg13g2/corners openroad -exit \
    #   flow/macro/ihp130_sg13g2/extract_multi_corner.tcl
    lib:
      nom_tt_025C_1v20:
        - dir::hardmacro/corners/PLL_ANALOG_MACRO__tt_1p20V_25C.lib
      nom_ss_125C_1v08:
        - dir::hardmacro/corners/PLL_ANALOG_MACRO__ss_1p08V_125C.lib
      nom_ff_n40C_1v32:
        - dir::hardmacro/corners/PLL_ANALOG_MACRO__ff_1p32V_m40C.lib
    # PDN generation needs the macro placed explicitly (PDN-0235 "Design has
    # unplaced macros" otherwise).  Die is 500x500 um placeholder; put the
    # 160x105 um macro near the origin with room for the digital ring.
    # Pin access: 30 of the 71 pins sit on the LEF's left edge (x=0) and 37 on
    # the right edge.  At location [0,0] the left pins land on the die
    # boundary and cannot be routed, which is what produced GRT-0116
    # congestion.  Keep at least one routing channel on every side.
    instances:
      pll_ana:
        location: [40, 40]
        orientation: N

# Macro power/ground connection.  Format (LibreLane v3.0.16):
#   <instance_name_rx> <vdd_net> <gnd_net> <vdd_pin> <gnd_pin>
# The macro LEF declares VDD/VSS as INOUT power pins on TopMetal1/TopMetal2;
# without this the PDN generator cannot channel to them (PDN-0179).
PDN_MACRO_CONNECTIONS:
  - "pll_ana VDD VSS VDD VSS"

# ---------------------------------------------------------------------------
# Clocks
# ---------------------------------------------------------------------------
CLOCK_PORT: REF
CLOCK_PERIOD: 20.0

PNR_SDC_FILE: dir::constraints/adpll.sdc
SIGNOFF_SDC_FILE: dir::constraints/adpll.sdc

# ---------------------------------------------------------------------------
# Floorplan / placement
# ---------------------------------------------------------------------------
FP_CORE_UTIL: 20
PL_TARGET_DENSITY_PCT: 35
# Placeholder only; replace once the macro dimensions and pin access are
# known, or remove to let LibreLane compute the die.  A 500x500 um die is NOT
# a floorplan -- it is a placeholder.
# The macro is 160 x 105 um.  A 500 x 500 um placeholder left too much empty
# core for the PDN generator to channel around the macro (PDN-0179).  Size the
# die to the macro plus a digital ring.
DIE_AREA: [0, 0, 400, 300]

VDD_NETS: [VDD]
GND_NETS: [VSS]

# ---------------------------------------------------------------------------
# Timing corners (same three as config.digital.yaml)
# ---------------------------------------------------------------------------
LIB:
  nom_tt_025C_1v20:
    - /shared/OpenROAD-flow-scripts/flow/platforms/ihp-sg13g2/lib/sg13g2_stdcell_typ_1p20V_25C.lib
  nom_ss_125C_1v08:
    - /shared/OpenROAD-flow-scripts/flow/platforms/ihp-sg13g2/lib/sg13g2_stdcell_slow_1p08V_125C.lib
  nom_ff_n40C_1v32:
    - /shared/OpenROAD-flow-scripts/flow/platforms/ihp-sg13g2/lib/sg13g2_stdcell_fast_1p32V_m40C.lib

STA_CORNERS:
  - nom_tt_025C_1v20
  - nom_ss_125C_1v08
  - nom_ff_n40C_1v32

# ---------------------------------------------------------------------------
# RC extraction (same OpenRCX rules file as the digital canary)
# ---------------------------------------------------------------------------
RCX_RULESETS:
  "nom_tt_025C_1v20": /shared/OpenROAD-flow-scripts/flow/platforms/ihp-sg13g2/rcx_patterns.rules
  "nom_ss_125C_1v08": /shared/OpenROAD-flow-scripts/flow/platforms/ihp-sg13g2/rcx_patterns.rules
  "nom_ff_n40C_1v32": /shared/OpenROAD-flow-scripts/flow/platforms/ihp-sg13g2/rcx_patterns.rules

# ---------------------------------------------------------------------------
# Signoff switches
# ---------------------------------------------------------------------------
# As in config.digital.yaml: no official IHP DRC/LVS/netgen collateral is
# installed.  These v3.0.16 flow gates keep the missing-tool steps from
# running; do not claim DRC/LVS/antenna results from this skeleton.
RUN_MAGIC_STREAMOUT: false
RUN_KLAYOUT_STREAMOUT: true
RUN_MAGIC_WRITE_LEF: false
RUN_KLAYOUT_XOR: false
RUN_MAGIC_DRC: false
RUN_KLAYOUT_DRC: false
RUN_LVS: false
RUN_EQY: false
