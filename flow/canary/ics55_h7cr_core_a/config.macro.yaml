# LibreLane skeleton -- FULL PLL top (pll) with PLL_ANALOG as a hard macro
#
# STATUS: SKELETON / NOT RUNNABLE YET.
# The PLL_ANALOG hard macro has NOT been built.  hardmacro/PLL_ANALOG.gds,
# .lef and .lib do not exist, so this config cannot run.  It documents the
# intended integration; see hardmacro/interface.md and manifest.yaml.
#
# When the macro exists, run from this directory:
#   librelane config.macro.yaml
# (or with the release's --pdk/--scl flags).
#
# The digital-only proof is config.digital.yaml.  This file is the next step,
# not a substitute for it.

DESIGN_NAME: pll

VERILOG_FILES:
  - dir::../../../src/pll.v
  - dir::../../../src/pll_logic.v
  - dir::../../../src/digital_loop_filter.v
  - dir::../../../src/term_decoder.v
  - dir::../../../src/freq_lock.v
  - dir::../../../src/delta_sigma.v
  - dir::../../../src/fix_div.v
  - dir::../../../src/conf_div.v
  # Blackbox only: do NOT also read src/pll_analog.v (duplicate module).
  - dir::hardmacro/PLL_ANALOG_blackbox.v

# ---------------------------------------------------------------------------
# PDK / standard-cell library
# ---------------------------------------------------------------------------
# ADAPT: some releases take PDK/STD_CELL_LIBRARY only from --pdk/--scl or only
# from a pdk::<pattern> block.  Keep whichever form the installed version
# accepts.
PDK: ics55

# The PDK ics55.map is a GDS-import map, not a LEF/DEF map.  Without this
# override KLayout streams DEF routing/SPNET onto auto layers.
KLAYOUT_DEF_LAYER_MAP: /opt/adpll_gen/flow/maps/ics55_lefdef.map
STD_CELL_LIBRARY: ics55_LLSC_H7CR

pdk::ics55*:
  PAD_CELL_LIBRARY: ICsprout_55LLULP1233_IO_251013

# ---------------------------------------------------------------------------
# Hard macro
# ---------------------------------------------------------------------------
# Expected views (none exist yet):
#   hardmacro/PLL_ANALOG.gds  stream-out of the analog macro
#   hardmacro/PLL_ANALOG.lef  abstracts: pins on the routing grid, obstructions,
#                             VDD/VSS, origin at (0,0)
#   hardmacro/PLL_ANALOG.lib  Liberty: input caps, clock/edge relationships,
#                             internal power; corner names MUST match LIB below
# LVS/CDL and SPICE are used by the macro build and top LVS, not by this key.
#
# Multi-corner note: this skeleton uses one macro Liberty (the TT/default
# corner).  The canary uses the three PDK-wired corners because the H7CR
# all-seven set is not cell-identical (ss_cworst_1p08_m40 lacks ICGNX3H7R).
# See README "Corner cell-set finding".
MACROS:
  PLL_ANALOG:
    gds: dir::hardmacro/PLL_ANALOG.gds
    lef: dir::hardmacro/PLL_ANALOG.lef
    lib: dir::hardmacro/PLL_ANALOG.lib
    # Optional explicit placement; without it the floorplanner places it.
    # instances:
    #   pll_ana:
    #     location: [50, 50]
    #     orientation: N

# Macro power/ground connection.  Key name and argument order differ between
# LibreLane releases; verify before enabling.
# PDN_MACRO_CONNECTIONS:
#   - "pll_ana VDD VSS VDD VSS"

# ---------------------------------------------------------------------------
# Clocks
# ---------------------------------------------------------------------------
CLOCK_PORT: REF
CLOCK_PERIOD: 20.0

# ADAPT: older releases use BASE_SDC_FILE; newer ones split PNR/SIGNOFF.
PNR_SDC_FILE: dir::constraints/adpll.sdc
SIGNOFF_SDC_FILE: dir::constraints/adpll.sdc

# ---------------------------------------------------------------------------
# Floorplan / placement (placeholders; macro area is not known yet)
# ---------------------------------------------------------------------------
FP_CORE_UTIL: 25
PL_TARGET_DENSITY_PCT: 45
# ADAPT: placeholder; replace once the macro dimensions and pin access are
# known, or remove to let LibreLane compute the die.
DIE_AREA: [0, 0, 500, 500]

VDD_NETS: [VDD]
GND_NETS: [VSS]

# ---------------------------------------------------------------------------
# Signoff switches (names/availability depend on the LibreLane release)
# ---------------------------------------------------------------------------
# ADAPT: not every release has these four keys (some use --skip / SKIP_*).


# ---------------------------------------------------------------------------
# RC extraction constants (same PDK values as config.digital.yaml)
# ---------------------------------------------------------------------------
RCX_RULESETS:
  "nom_tt_*": /grid/icsprout55-pdk/libs.tech/librelane/ics55_LLSC_H7CR/rcx_typ.rules
  "nom_ss_*": /grid/icsprout55-pdk/libs.tech/librelane/ics55_LLSC_H7CR/rcx_nom_ss_125C_1v08.rules
  "nom_ff_*": /grid/icsprout55-pdk/libs.tech/librelane/ics55_LLSC_H7CR/rcx_nom_ff_n40C_1v32.rules

LAYERS_RC:
  "nom_*":
    MET1: {res: 0.1122, cap: 0.0007630}
    MET2: {res: 0.0914, cap: 0.0011069}
    MET3: {res: 0.0914, cap: 0.0011069}
    MET4: {res: 0.0914, cap: 0.0011069}
    MET5: {res: 0.0914, cap: 0.0006259}
    T4M2: {res: 0.0239, cap: 0.0001299}
VIAS_R:
  "nom_*":
    VIA1: {res: 2.5}
    VIA2: {res: 2.5}
    VIA3: {res: 2.5}
    VIA4: {res: 2.5}
    T4V2: {res: 2.5}

# ---------------------------------------------------------------------------
# Timing corners (same three PDK-wired H7CR corners as config.digital.yaml)
# ---------------------------------------------------------------------------
# The macro Liberty must be characterized/mapped for these corner names.  If
# it is TT-only, run the canary at nom_tt_025C_1v20 only and do NOT claim the
# other corners; a TT-only macro is not a Tier-2 signoff.
LIB:
  nom_tt_025C_1v20:
    - /grid/icsprout55-pdk/libs.ref/ics55_LLSC_H7CR/liberty/ics55_LLSC_H7CR_typ_tt_1p2_25_nldm.lib
  nom_ss_125C_1v08:
    - /grid/icsprout55-pdk/libs.ref/ics55_LLSC_H7CR/liberty/ics55_LLSC_H7CR_ss_rcworst_1p08_125_nldm.lib
  nom_ff_n40C_1v32:
    - /grid/icsprout55-pdk/libs.ref/ics55_LLSC_H7CR/liberty/ics55_LLSC_H7CR_ff_rcbest_1p32_m40_nldm.lib

STA_CORNERS:
  - nom_tt_025C_1v20
  - nom_ss_125C_1v08
  - nom_ff_n40C_1v32
