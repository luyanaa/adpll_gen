# LibreLane 3.0.16 config -- FULL PLL top (pll) with PLL_ANALOG hard macro
# PDK: gf180mcu, library: gf180mcu_as_sc_mcu7t3v3 (3.3 V, 7-track)
#
# STATUS: SKELETON / NOT RUNNABLE YET.
# The PLL_ANALOG hard macro has NOT been built.  hardmacro/PLL_ANALOG.gds,
# .lef and .lib do not exist, so this config cannot run.  It documents the
# intended integration; see hardmacro/interface.md and manifest.yaml.
#
# When the macro exists, run from this directory:
#   make librelane-macro
# or directly:
#   librelane --manual-pdk --pdk-root pdk_overlay --pdk gf180mcu \
#             --scl gf180mcu_as_sc_mcu7t3v3 config.macro.yaml
# (the driver's --skip list for missing signoff collateral also applies)
#
# The digital-only proof is config.digital.yaml.  This file is the next step,
# not a substitute for it.

DESIGN_NAME: pll

VERILOG_FILES:
  - dir::../../../src/pll.v
  - dir::../../../src/pll_logic.v
  - dir::../../../src/digital_loop_filter.v
  - dir::../../../src/term_decoder.v
  - dir::../../../src/freq_lock.v
  - dir::../../../src/delta_sigma.v
  - dir::../../../src/fix_div.v
  - dir::../../../src/conf_div.v
  # Blackbox only: do NOT also read src/pll_analog.v (duplicate module).
  - dir::hardmacro/PLL_ANALOG_blackbox.v

# ---------------------------------------------------------------------------
# PDK / standard-cell library
# ---------------------------------------------------------------------------
PDK: gf180mcu
STD_CELL_LIBRARY: gf180mcu_as_sc_mcu7t3v3

# ---------------------------------------------------------------------------
# Actual gf180mcu_as_sc_mcu7t3v3 views (same as config.digital.yaml)
# ---------------------------------------------------------------------------
TECH_LEFS:
  "nom_*": /grid/gf180mcu/gf180mcu_as_sc_mcu7t3v3/pdk/libs.ref/gf180mcu_as_sc_mcu7t3v3/techlef/gf180mcu_as_sc_mcu7t3v3__nom.tlef
  "min_*": /grid/gf180mcu/gf180mcu_as_sc_mcu7t3v3/pdk/libs.ref/gf180mcu_as_sc_mcu7t3v3/techlef/gf180mcu_as_sc_mcu7t3v3__min.tlef
  "max_*": /grid/gf180mcu/gf180mcu_as_sc_mcu7t3v3/pdk/libs.ref/gf180mcu_as_sc_mcu7t3v3/techlef/gf180mcu_as_sc_mcu7t3v3__max.tlef

CELL_LEFS:
  - /grid/gf180mcu/gf180mcu_as_sc_mcu7t3v3/pdk/libs.ref/gf180mcu_as_sc_mcu7t3v3/lef/gf180mcu_as_sc_mcu7t3v3.lef
CELL_GDS:
  - /grid/gf180mcu/gf180mcu_as_sc_mcu7t3v3/pdk/libs.ref/gf180mcu_as_sc_mcu7t3v3/gds/gf180mcu_as_sc_mcu7t3v3.gds
CELL_VERILOG_MODELS:
  - /grid/gf180mcu/gf180mcu_as_sc_mcu7t3v3/pdk/libs.ref/gf180mcu_as_sc_mcu7t3v3/verilog/gf180mcu_as_sc_mcu7t3v3.v
CELL_SPICE_MODELS:
  - /grid/gf180mcu/gf180mcu_as_sc_mcu7t3v3/pdk/libs.ref/gf180mcu_as_sc_mcu7t3v3/cdl/gf180mcu_as_sc_mcu7t3v3.cdl
CELL_CDLS:
  - /grid/gf180mcu/gf180mcu_as_sc_mcu7t3v3/pdk/libs.ref/gf180mcu_as_sc_mcu7t3v3/cdl/gf180mcu_as_sc_mcu7t3v3.cdl

VDD_PIN: VDD
GND_PIN: VSS
# VNW is the n-well bias (VDD) and VPW the p-well bias (VSS).  They are
# USE POWER/GROUND pins in the LEF and must be globally connected, or the
# disconnected-pin checker flags every cell's well pins as critical.
SCL_POWER_PINS: [VDD, VNW]
SCL_GROUND_PINS: [VSS, VPW]
VDD_NETS: [VDD]
GND_NETS: [VSS]

RT_MIN_LAYER: Metal2
RT_MAX_LAYER: Metal5
IO_PIN_H_LAYER: Metal3
IO_PIN_V_LAYER: Metal2

# ---------------------------------------------------------------------------
# Hard macro
# ---------------------------------------------------------------------------
# Expected views (none exist yet):
#   hardmacro/PLL_ANALOG.gds  stream-out of the analog macro
#   hardmacro/PLL_ANALOG.lef  abstract: pins on the gf180 routing grid
#                             (Metal1 rails, Metal2 pin access), obstructions,
#                             VDD/VSS, origin at (0,0)
#   hardmacro/PLL_ANALOG.lib  Liberty: input caps, clock/edge relationships,
#                             internal power; corner names MUST match LIB below
# LVS/CDL and SPICE are used by the macro build and top LVS, not by this key.
MACROS:
  PLL_ANALOG:
    gds: dir::hardmacro/PLL_ANALOG.gds
    lef: dir::hardmacro/PLL_ANALOG.lef
    lib: dir::hardmacro/PLL_ANALOG.lib
    # Optional explicit placement; without it the floorplanner places it.
    # instances:
    #   pll_ana:
    #     location: [200, 200]
    #     orientation: N

# Macro power/ground connection.  Key name and argument order differ between
# LibreLane releases; verify before enabling.
# PDN_MACRO_CONNECTIONS:
#   - "pll_ana VDD VSS VDD VSS"

# ---------------------------------------------------------------------------
# Clocks and constraints
# ---------------------------------------------------------------------------
CLOCK_PORT: REF
CLOCK_PERIOD: 12.5

PNR_SDC_FILE: dir::constraints/adpll.sdc
SIGNOFF_SDC_FILE: dir::constraints/adpll.sdc

# ---------------------------------------------------------------------------
# Floorplan / placement (placeholders; macro area is not known yet)
# ---------------------------------------------------------------------------
# No DIE_AREA: the macro dimensions are unknown.  Once the LEF exists, either
# let LibreLane size the core from FP_CORE_UTIL or set a DIE_AREA that fits the
# macro plus the ~49k um^2 digital control.
FP_CORE_UTIL: 25
PL_TARGET_DENSITY_PCT: 45

# ---------------------------------------------------------------------------
# PDN (same canary values as config.digital.yaml)
# ---------------------------------------------------------------------------
PDN_RAIL_LAYER: Metal1
PDN_RAIL_WIDTH: 0.6
PDN_VERTICAL_LAYER: Metal4
PDN_HORIZONTAL_LAYER: Metal5
PDN_VWIDTH: 1.12
PDN_HWIDTH: 0.90
PDN_VSPACING: 0.56
PDN_HSPACING: 0.90
PDN_VPITCH: 20
PDN_HPITCH: 20
PDN_VOFFSET: 5
PDN_HOFFSET: 5
PDN_CORE_RING: false

# ---------------------------------------------------------------------------
# Cell selection / synthesis (same as config.digital.yaml)
# ---------------------------------------------------------------------------
FILL_CELLS: ["gf180mcu_as_sc_mcu7t3v3__fill_*"]
DECAP_CELLS: ["gf180mcu_as_sc_mcu7t3v3__fillcap_*"]
TRISTATE_CELLS: ["gf180mcu_as_sc_mcu7t3v3__invz*"]
CELL_PAD_EXCLUDE:
  - "gf180mcu_as_sc_mcu7t3v3__tap_2"
  - "gf180mcu_as_sc_mcu7t3v3__fill_*"

WELLTAP_CELL: gf180mcu_as_sc_mcu7t3v3__tap_2
ENDCAP_CELL: gf180mcu_as_sc_mcu7t3v3__tap_2
FP_TAPCELL_DIST: 20

SYNTH_DRIVING_CELL: gf180mcu_as_sc_mcu7t3v3__inv_2/Y
SYNTH_BUFFER_CELL: gf180mcu_as_sc_mcu7t3v3__buff_2/A/Y
SYNTH_TIEHI_CELL: gf180mcu_as_sc_mcu7t3v3__tieh_4/ONE
SYNTH_TIELO_CELL: gf180mcu_as_sc_mcu7t3v3__tiel_4/ZERO
OUTPUT_CAP_LOAD: 72.91

SYNTH_EXCLUDED_CELL_FILE: /grid/gf180mcu/gf180mcu_as_sc_mcu7t3v3/pdk/libs.tech/librelane/gf180mcu_as_sc_mcu7t3v3/synth_exclude.cells
PNR_EXCLUDED_CELL_FILE: /grid/gf180mcu/gf180mcu_as_sc_mcu7t3v3/pdk/libs.tech/librelane/gf180mcu_as_sc_mcu7t3v3/pnr_exclude.cells

CTS_ROOT_BUFFER: gf180mcu_as_sc_mcu7t3v3__clkbuff_12
CTS_CLK_BUFFERS:
  - gf180mcu_as_sc_mcu7t3v3__clkbuff_4
  - gf180mcu_as_sc_mcu7t3v3__clkbuff_8
  - gf180mcu_as_sc_mcu7t3v3__clkbuff_12

MAX_FANOUT_CONSTRAINT: 9
MAX_TRANSITION_CONSTRAINT: 1.5
MAX_CAPACITANCE_CONSTRAINT: 0.2
CLOCK_UNCERTAINTY_CONSTRAINT: 0.25
CLOCK_TRANSITION_CONSTRAINT: 0.50

# ---------------------------------------------------------------------------
# RC estimates (same as config.digital.yaml; no OpenRCX rules in the PDK)
# ---------------------------------------------------------------------------
# Empty for the same reason as config.digital.yaml: the PDK ships no rules.
RCX_RULESETS: {}
LAYERS_RC:
  "nom_*":
    Metal1: {res: 0.090, cap: 0.0004}
    Metal2: {res: 0.090, cap: 0.0003}
    Metal3: {res: 0.090, cap: 0.00028}
    Metal4: {res: 0.090, cap: 0.000277}
    Metal5: {res: 0.060, cap: 0.0000394}
VIAS_R:
  "nom_*":
    Via1: {res: 5.0}
    Via2: {res: 5.0}
    Via3: {res: 5.0}
    Via4: {res: 5.0}

# ---------------------------------------------------------------------------
# Timing corners
# ---------------------------------------------------------------------------
# The macro Liberty must be characterized/mapped for these corner names.  If
# it is TT-only, run the macro canary at nom_tt_025C_3v30 only and do NOT claim
# the other corners; a TT-only macro is not a signoff.
LIB:
  "*_tt_025C_3v30":
    - /grid/gf180mcu/gf180mcu_as_sc_mcu7t3v3/pdk/libs.ref/gf180mcu_as_sc_mcu7t3v3/lib/gf180mcu_as_sc_mcu7t3v3__tt_025C_3v30.lib
  "*_ff_n40C_3v60":
    - /grid/gf180mcu/gf180mcu_as_sc_mcu7t3v3/pdk/libs.ref/gf180mcu_as_sc_mcu7t3v3/lib/gf180mcu_as_sc_mcu7t3v3__ff_n40C_3v60.lib
  "*_ss_125C_3v00":
    - /grid/gf180mcu/gf180mcu_as_sc_mcu7t3v3/pdk/libs.ref/gf180mcu_as_sc_mcu7t3v3/lib/gf180mcu_as_sc_mcu7t3v3__ss_125C_3v00.lib

STA_CORNERS:
  - nom_tt_025C_3v30
  - nom_ff_n40C_3v60
  - nom_ss_125C_3v00
PNR_CORNERS:
  - nom_tt_025C_3v30
  - nom_ff_n40C_3v60
  - nom_ss_125C_3v00
